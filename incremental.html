    <!-- JAMS Library -->
    <script src="js/clustering.js"></script>

path {
  stroke: #f0f;
}

path:first-child {
  fill: yellow !important;
}

<body>
    <h1>Incremental Clustering Demo</h1>
    <div class="controls">
        <label><input type="radio" name="algo" value="seqkmeans" checked /> Sequential K-Means</label>
        <br />

        <label>Clusters (K): &nbsp;&nbsp;&nbsp;<input type="number" value="3" id="count" style="width: 10ex; padding-left: 0.75ex;"/></label>
        <br />

        <input type="button" value="Begin Clustering" id="start" />
        <input type="button" value="Reset Clustering" id="reset" disabled />
        <input type="button" value="Reveal Next Point" id="next" disabled />
        <input type="button" value="Clear Demo" id="clear" />
    </div>

    <div id="content">
    </div>
</body>
